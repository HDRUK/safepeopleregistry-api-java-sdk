paths:
  /api/v1/custodian_users/bulk:
    post:
      description: Create multiple CustodianUser entries
      operationId: custodianUserBulkStore
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/custodianUserBulkStore_request"
        description: Array of CustodianUser definitions
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/custodianUserBulkStore_201_response"
          description: Success
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/custodianUserBulkStore_500_response"
          description: Error
      security:
      - bearerAuth: []
      summary: Create multiple CustodianUser entries
      tags:
      - CustodianUser
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/features:
    get:
      description: Return a list of Feature entries
      operationId: featureIndex
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/featureIndex_200_response"
          description: Success
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/featureIndex_404_response"
          description: Not found response
      security:
      - bearerAuth: []
      summary: Feature@index
      tags:
      - Feature
      x-accepts:
      - application/json
  /api/v1/project_users/bulk:
    post:
      description: Invite multiple users and attach them to a project
      operationId: projectUsersBulkInviteProjectUsers
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/projectUsersBulkInviteProjectUsers_request"
        required: true
      responses:
        "201":
          description: Success
      security:
      - bearerAuth: []
      summary: Bulk invite Project Users
      tags:
      - ProjectUsers
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/query:
    post:
      description: "Query the registry by Digital Identifier. Authenticated via x-client-id/x-signature\
        \ headers (Custodian client credential + HMAC-signed payload), not a bearer\
        \ token."
      operationId: queryQuery
      parameters:
      - description: Custodian client ID used to authenticate the requesting custodian
        explode: false
        in: header
        name: x-client-id
        required: true
        schema:
          example: 8f14e45f-ceea-467e-adc1-0000example
          type: string
        style: simple
      - description: "HMAC signature of the raw request body, signed with the custodian's\
          \ unique identifier"
        explode: false
        in: header
        name: x-signature
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/queryQuery_request"
        description: Query definition
        required: true
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/queryQuery_401_response"
          description: Unauthorised - missing or unrecognised x-client-id header
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/featureIndex_404_response"
          description: Not found response
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/queryQuery_200_response"
          description: Success
      summary: Query@query
      tags:
      - Query
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/webhooks/{provider}:
    post:
      operationId: vendorWebhookReceiverReceive
      parameters:
      - description: Name of the vendor providing the webhook
        explode: false
        in: path
        name: provider
        required: true
        schema:
          example: example-provider
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
              event: user.created
              data:
                id: 123
                name: John Doe
            schema:
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/vendorWebhookReceiverReceive_200_response"
          description: Webhook processed successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/vendorWebhookReceiverReceive_400_response"
          description: Invalid argument(s)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/vendorWebhookReceiverReceive_500_response"
          description: Internal server error
      summary: Receive a webhook callback from a vendor
      tags:
      - VendorWebhookReceiver
      x-content-type: application/json
      x-accepts:
      - application/json
components:
  responses:
    "500":
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/custodianUserBulkStore_500_response"
      description: Error
  schemas:
    Accreditation:
      description: Accreditation model
      properties:
        id:
          description: Unique identifier for the accreditation
          example: 1
          type: integer
        associated_organisation_name:
          description: Name of the associated organisation
          example: University of Example
          type: string
        id_string:
          description: ID string for the accreditation
          example: "123456"
          type: string
        issue_date:
          description: Date when the accreditation was issued
          example: 2023-01-01
          format: date
          type: string
        expiry_date:
          description: Date when the accreditation expires
          example: 2026-06-25
          format: date
          type: string
        created_at:
          description: Timestamp when the accreditation was created
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
        updated_at:
          description: Timestamp when the accreditation was last updated
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
      title: Accreditation
      type: object
    ActionLog:
      description: Action Log model
      properties:
        id:
          description: Model primary key
          example: 1
          type: integer
        entity_type:
          description: Type of the entity associated with the action log
          example: User
          type: string
        entity_id:
          description: ID of the entity associated with the action log
          example: 1
          type: integer
        action:
          description: Description of the action performed
          example: Updated profile
          type: string
        completed_at:
          description: Timestamp when the action was completed (nullable)
          example: 2023-10-10T15:43:00Z
          format: date-time
          type: string
      title: Action Log
      type: object
    Affiliation:
      description: Affiliation model
      properties:
        id:
          description: Model primary key
          example: 1
          type: integer
        created_at:
          example: 2023-10-10T15:03:00Z
          type: string
        updated_at:
          example: 2023-10-10T15:43:00Z
          type: string
        organisation_id:
          description: Organisational link
          example: 1
          type: integer
        member_id:
          description: Member ID UUID
          example: 325987-skdjfh283429-lkfsfdh
          type: string
        relationship:
          description: Textual representation of affiliation relationship
          example: employee
          type: string
        from:
          description: Date affiliation commenced
          example: 2023-01-12
          type: string
        to:
          description: Date affiliation concluded
          example: 2024-12-01
          type: string
        department:
          description: Department worked during affiliation
          example: Research & Development
          type: string
        role:
          description: Role held during affiliation
          example: Principal Investigator (PI)
          type: string
        email:
          description: Professional email held during affiliation
          example: user@domain.com
          type: string
        ror:
          description: The ROR.org identifier for this affiliation institute
          example: 0hgyr56
          type: string
        registry_id:
          description: The Registry primary key associated with this affiliation
          example: 123
          type: integer
        current_employer:
          description: Flag indicating if affiliation is for the current employer
          example: true
          type: boolean
        verification_code:
          description: Unique verification code issued for confirmation
          example: a9f34b1c-6d8f-47f2-9131-1d2b56a3e7df
          type: string
        verification_sent_at:
          description: Timestamp when verification code was sent
          example: 2025-09-18T12:45:00Z
          format: date-time
          type: string
        verification_confirmed_at:
          description: Timestamp when verification was confirmed
          example: 2025-09-19T09:10:00Z
          format: date-time
          type: string
        is_verified:
          description: Flag indicating if affiliation is verified
          example: true
          type: boolean
      title: Affiliation
      type: object
    Charity:
      description: Charity model
      properties:
        id:
          description: Unique identifier for the charity
          example: 1
          type: integer
        registration_id:
          description: Registration ID of the charity
          example: "123456"
          type: string
        name:
          description: Name of the charity
          example: Health Pathways Charity
          type: string
        website:
          description: Website URL of the charity
          example: https://healthpathways.org
          type: string
        address_1:
          description: First line of the charity's address
          example: 123 Charity Lane
          type: string
        address_2:
          description: Second line of the charity's address
          example: Suite 456
          type: string
        town:
          description: Town where the charity is located
          example: Charity Town
          type: string
        county:
          description: County where the charity is located
          example: Charity County
          type: string
        country:
          description: Country where the charity is located
          example: UK
          type: string
        postcode:
          description: Postcode of the charity's address
          example: CH12 3AR
          type: string
      title: Charity
      type: object
    Custodian:
      description: Custodian model
      properties:
        id:
          description: Model primary key
          example: 1
          type: integer
        created_at:
          example: 2023-10-10T15:03:00Z
          type: string
        updated_at:
          example: 2023-10-10T15:03:00Z
          type: string
        name:
          example: Custodian Name
          type: string
        unique_identifier:
          description: A unique identifier for Custodian's within SOURSD
          example: aVl9jMgJHQjZz0xMOJ56hNyJJm9nIjm51TSf7Wp6
          type: string
        contact_email:
          example: key.contact.email@email.com
          type: string
        enabled:
          example: true
          type: boolean
        invite_accepted_at:
          example: 2023-10-10T15:03:00Z
          type: string
        invite_sent_at:
          example: 2023-10-10T15:03:00Z
          type: string
        idvt_required:
          example: false
          type: boolean
        gateway_app_id:
          example: HfjmY6rOymGjQwGcPkXIghYOggDcV1A83no4pbZp
          type: string
        gateway_client_id:
          example: RTWSlsx8iuQxN6JmfKFkopyWF8wfeKNt4tkuJcS3
          type: string
        client_id:
          example: 1111-2222-3333-4444-5555
          type: string
      title: Custodian
      type: object
    CustodianHasProjectOrganisation:
      description: Custodian approval status for a project organisation
      properties:
        id:
          example: 1
          readOnly: true
          type: integer
        project_has_organisation_id:
          description: ID of the project organisation
          example: 42
          type: integer
        custodian_id:
          description: ID of the custodian
          example: 7
          type: integer
        approved:
          description: Approval flag
          example: true
          nullable: true
          type: boolean
        comment:
          description: Optional comment
          example: Approved after review
          nullable: true
          type: string
        created_at:
          example: 2024-06-01T12:34:56Z
          format: date-time
          type: string
        updated_at:
          example: 2024-06-01T14:00:00Z
          format: date-time
          type: string
        projectOrganisation:
          $ref: "#/components/schemas/ProjectHasOrganisation"
        custodian:
          $ref: "#/components/schemas/Custodian"
      required:
      - custodian_id
      - project_has_organisation_id
      title: CustodianHasProjectOrganisation
      type: object
    CustodianHasProjectUser:
      properties:
        id:
          example: 1
          type: integer
        project_has_user_id:
          example: 1
          type: integer
        custodian_id:
          example: 1
          type: integer
        created_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
        projectHasUser:
          $ref: "#/components/schemas/ProjectHasUser"
      title: Custodian Has Project User
      type: object
    CustodianModelConfig:
      description: CustodianModelConfig model
      properties:
        id:
          description: Model primary key
          example: 1
          type: integer
        created_at:
          example: 2023-10-10T15:03:00Z
          type: string
        updated_at:
          example: 2023-10-10T18:03:00Z
          type: string
        decision_model_id:
          example: 1
          type: integer
        active:
          example: true
          type: boolean
        custodian_id:
          example: 12
          type: integer
      title: CustodianModelConfig
      type: object
    CustodianUser:
      description: CustodianUser model
      properties:
        id:
          description: Model primary key
          example: 1
          type: integer
        custodian_id:
          description: Custodian primary key
          example: 1
          type: integer
        created_at:
          example: 2023-10-10T15:03:00Z
          type: string
        updated_at:
          example: 2023-10-10T15:03:00Z
          type: string
        first_name:
          example: John
          type: string
        last_name:
          example: Smith
          type: string
        email:
          example: First name
          type: string
      title: Custodian User
      type: object
    CustodianUserHasPermission:
      description: Model representing the relationship between Custodian Users and
        Permissions
      properties:
        custodian_user_id:
          description: ID of the custodian user
          example: 1
          type: integer
        permission_id:
          description: ID of the permission
          example: 2
          type: integer
      title: CustodianUserHasPermission
      type: object
    CustodianWebhookReceiver:
      description: Model representing webhook receivers for custodians
      properties:
        id:
          description: Unique identifier for the webhook receiver
          example: 1
          type: integer
        custodian_id:
          description: ID of the custodian associated with the webhook receiver
          example: 1
          type: integer
        url:
          description: URL of the webhook receiver
          example: https://example.com/webhook
          type: string
        webhook_event:
          description: ID of the webhook event associated with the receiver
          example: 2
          type: integer
        created_at:
          description: Timestamp when the webhook receiver was created
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
        updated_at:
          description: Timestamp when the webhook receiver was last updated
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
      title: CustodianWebhookReceiver
      type: object
    DebugLog:
      description: Model representing debug logs
      properties:
        id:
          description: Unique identifier for the debug log
          example: 1
          type: integer
        class:
          description: Class name where the log was generated
          example: App\Http\Controllers\Api\V1\CustodianController
          type: string
        log:
          description: Log message
          example: An error occurred while processing the request.
          type: string
        created_at:
          description: Timestamp when the log was created
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
        updated_at:
          description: Timestamp when the log was last updated
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
      title: DebugLog
      type: object
    DecisionModel:
      description: Model representing decision models
      properties:
        id:
          description: Unique identifier for the decision model
          example: 1
          type: integer
        model_type:
          description: Type of the model associated with the decision
          example: App\Models\User
          type: string
        conditions:
          description: Conditions for the decision model
          example: status=active
          type: string
        rule_class:
          description: Class defining the rules for the decision model
          example: App\Rules\CustomRule
          type: string
        description:
          description: Description of the decision model
          example: Decision model for user validation
          type: string
        decision_model_type_id:
          description: ID of the decision model type associated with the decision
          example: 42
          type: integer
        created_at:
          description: Timestamp when the decision model was created
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
        updated_at:
          description: Timestamp when the decision model was last updated
          example: 2025-06-26T12:00:00Z
          format: date-time
          type: string
      required:
      - conditions
      - model_type
      - rule_class
      title: DecisionModel
      type: object
    DecisionModelType:
      description: Model representing types of decision models
      properties:
        id:
          description: Unique identifier for the decision model type
          example: 1
          type: integer
        name:
          description: Name of the decision model type
          example: Decision Models
          type: string
        created_at:
          description: Timestamp when the decision model type was created
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
        updated_at:
          description: Timestamp when the decision model type was last updated
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
      title: DecisionModelType
      type: object
    Department:
      description: Model representing departments
      properties:
        id:
          description: Unique identifier for the department
          example: 1
          type: integer
        name:
          description: Name of the department
          example: Research Department
          type: string
        category:
          description: Category of the department
          example: Health Research
          type: string
        created_at:
          description: Timestamp when the department was created
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
        updated_at:
          description: Timestamp when the department was last updated
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
      title: Department
      type: object
    Education:
      description: Model representing education records
      properties:
        id:
          description: Unique identifier for the education record
          example: 1
          type: integer
        title:
          description: Title of the education qualification
          example: Bachelor of Science in Computer Science
          type: string
        from:
          description: Start date of the education qualification
          example: 2015-09-01
          format: date
          type: string
        to:
          description: End date of the education qualification
          example: 2019-06-30
          format: date
          type: string
        institute_name:
          description: Name of the educational institute
          example: University of Example
          type: string
        institute_address:
          description: Address of the educational institute
          example: "123 University Lane, Example City"
          type: string
        institute_identifier:
          description: Identifier for the educational institute
          example: https://ror.org/12345
          type: string
        source:
          description: Source of the education record
          example: Self-reported
          type: string
        registry_id:
          description: ID of the registry associated with the education record
          example: 42
          type: integer
        created_at:
          description: Timestamp when the education record was created
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
        updated_at:
          description: Timestamp when the education record was last updated
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
      title: Education
      type: object
    Endorsement:
      description: Model representing endorsements
      properties:
        id:
          description: Unique identifier for the endorsement
          example: 1
          type: integer
        reported_by:
          description: ID of the user who reported the endorsement
          example: 42
          type: integer
        comment:
          description: Optional comment provided by the reporter
          example: This is a comment regarding the endorsement.
          type: string
        raised_against:
          description: ID of the entity the endorsement is raised against
          example: 24
          type: integer
        created_at:
          description: Timestamp when the endorsement was created
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
        updated_at:
          description: Timestamp when the endorsement was last updated
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
      title: Endorsement
      type: object
    Experience:
      description: Model representing experiences
      properties:
        id:
          description: Unique identifier for the experience
          example: 1
          type: integer
        project_id:
          description: ID of the project associated with the experience
          example: 42
          type: integer
        from:
          description: Start date of the experience
          example: 2020-01-01
          format: date
          type: string
        to:
          description: End date of the experience
          example: 2022-12-31
          format: date
          type: string
        organisation_id:
          description: ID of the organisation associated with the experience
          example: 24
          type: integer
        created_at:
          description: Timestamp when the experience was created
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
        updated_at:
          description: Timestamp when the experience was last updated
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
      title: Experience
      type: object
    File:
      description: Model representing files
      properties:
        id:
          description: Unique identifier for the file
          example: 1
          type: integer
        name:
          description: Name of the file
          example: Researcher List
          type: string
        type:
          description: Type of the file
          example: researcher_list
          type: string
        path:
          description: Path to the file
          example: /uploads/researcher_list.csv
          type: string
        status:
          description: Status of the file
          example: processed
          type: string
        created_at:
          description: Timestamp when the file was created
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
        updated_at:
          description: Timestamp when the file was last updated
          example: 2025-06-25T12:00:00Z
          format: date-time
          type: string
      title: File
      type: object

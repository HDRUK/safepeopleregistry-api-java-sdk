paths:
  /api/v1/accreditations/{registryId}:
    get:
      operationId: accreditationIndexByRegistryId
      parameters:
      - description: ID of the registry
        explode: false
        in: path
        name: registryId
        required: true
        schema:
          example: 1
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/accreditationIndexByRegistryId_200_response"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/accreditationIndexByRegistryId_400_response"
          description: Invalid argument(s)
      summary: Get accreditations by registry ID
      tags:
      - Accreditation
      x-accepts:
      - application/json
    post:
      operationId: accreditationStoreByRegistryId
      parameters:
      - description: ID of the registry
        explode: false
        in: path
        name: registryId
        required: true
        schema:
          example: 1
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Accreditation"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/accreditationStoreByRegistryId_201_response"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/accreditationIndexByRegistryId_400_response"
          description: Invalid argument(s)
      summary: Create accreditation for a registry
      tags:
      - Accreditation
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/accreditations/{id}/registries/{registryId}:
    put:
      operationId: accreditationUpdateByRegistryId
      parameters:
      - description: ID of the registry
        explode: false
        in: path
        name: registryId
        required: true
        schema:
          example: 1
          type: integer
        style: simple
      - description: ID of the accreditation
        explode: false
        in: path
        name: id
        required: true
        schema:
          example: 1
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Accreditation"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/accreditationUpdateByRegistryId_200_response"
          description: Updated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/accreditationIndexByRegistryId_400_response"
          description: Invalid argument(s)
      summary: Update accreditation for a registry
      tags:
      - Accreditation
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/{entity}/{id}/action_log:
    get:
      description: "Retrieve action logs for a given entity type (users, organisations)\
        \ by ID."
      operationId: actionLogsGetEntityActionLog
      parameters:
      - description: "The entity type (e.g., users, organisations)"
        explode: false
        in: path
        name: entity
        required: true
        schema:
          type: string
        style: simple
      - description: The ID of the entity
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/actionLogsGetEntityActionLog_200_response"
          description: Successful response with action logs
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/actionLogsGetEntityActionLog_404_response"
          description: No action logs found for this entity
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/actionLogsGetEntityActionLog_400_response"
          description: Invalid entity type
      summary: Get Action Logs for an Entity
      tags:
      - Action Logs
      x-accepts:
      - application/json
  /api/v1/action_logs/{id}:
    put:
      description: "Update an action log entry, including marking it as complete or\
        \ incomplete."
      operationId: actionLogsUpdate
      parameters:
      - description: ID of the action log
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      - description: Mark as complete
        explode: true
        in: query
        name: complete
        required: false
        schema:
          type: boolean
        style: form
      - description: Mark as incomplete
        explode: true
        in: query
        name: incomplete
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/actionLogsUpdate_200_response"
          description: Action status updated successfully
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/actionLogsUpdate_404_response"
          description: Action log not found
      security:
      - bearerAuth: []
      summary: Update an Action Log
      tags:
      - Action Logs
      x-accepts:
      - application/json
